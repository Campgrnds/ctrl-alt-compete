<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTRL + ALT + COMPETE</title>
<meta name="description" content="A team review game for 7th grade Computer Science: Computing Systems and Networks & the Internet.">
<meta name="theme-color" content="#060F1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='48' rx='10' fill='%230A1628' stroke='%23E8B048' stroke-width='4'/%3E%3Cpath d='M20 40V24M20 24h8M36 24l8 16M44 24l-8 16' stroke='%235EEAD4' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-circuit"></div>
  <div class="bg-traces">
    <i style="--y:14%;--d:9s;--delay:-2s"></i>
    <i style="--y:37%;--d:13s;--delay:-7s"></i>
    <i style="--y:61%;--d:11s;--delay:-4s"></i>
    <i style="--y:86%;--d:15s;--delay:-10s"></i>
  </div>
</div>
<main id="app" aria-live="polite"><div class="loading"><div class="loading-chip"></div><p>Booting up…</p></div></main>
<div id="modal-root"></div>
<div id="peek" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<!-- Bundled copy of questions.json so the game still runs when opened straight from a folder -->
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
